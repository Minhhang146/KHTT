<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.css"
    />
    <title>EduMate</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style2.css" />
    <link rel="stylesheet" href="style3.css" />
  </head>

  <body>
    <header id="header">
      <div id="header-inner">
        <section class="right">
          <a href="index.html" id="logo">
            <img src="img/logo.webp" alt="Logo" />
           <span>Edu<span id="logo-span">Mate</span></span>
          </a>
        </section>
        <button id="menu-btn" aria-label="Mở menu" aria-expanded="false">☰</button>
        <ul id="nav" class="center">
          <li id="nav-gioi-thieu">
            <a href="index.html" id="link-gioi-thieu" class="active">Giới thiệu</a>
          </li>
          <li id="nav-bai-tap">
            <a href="subjects.html" id="link-bai-tap">Bài tập</a>
          </li>
          <li id="nav-cuoc-thi">
           <a href="contest.html" id="link-cuoc-thi">Cuộc thi</a>
          </li>
          <li id="nav-xep-hang">
           <a href="ranking.html" id="link-xep-hang">Xếp hạng</a>
          </li>
        </ul>
        <!-- KHU VỰC TÀI KHOẢN -->
        <div class="user-account-area">
          <div id="auth-buttons">
            <a href="login.html" class="auth-link">Đăng nhập</a>
            <a href="register.html" class="auth-link">Đăng ký</a>
          </div>
          <!-- 2. Khi đã đăng nhập (mặc định thêm class hidden) -->
          <div id="user-profile" class="hidden">
            <div class="streak-box">🔥 <span>0</span></div>
            <span class="username">Username</span>
           <img src="img/avartar.webp" alt="Avatar" class="user-avatar" />
          </div>
        </div>
      </div>
    </header>

    <div class="container">
        <h2>Hồ sơ của bạn</h2>
        <p>Tên: <b id="pf-username"></b></p>
        <p>Giới thiệu: <span id="pf-bio"></span></p>
        <p>Điểm: <b id="pf-score"></b></p>
        <p>Chuỗi ngày: 🔥 <b id="pf-streak"></b></p>
        <p>Môn chuyên: <span id="pf-chuyen"></span></p>
    </div>

    <script src="profile.js"></script>
    <script src="script.js"></script>
  </body>
</html>
