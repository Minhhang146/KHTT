<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.css"
    />
    <title>EduMate</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style2.css" />
    <link rel="stylesheet" href="style3.css" />
  </head>

  <body>
    <header id="header">
      <div id="header-inner">
        <section class="right">
          <a href="index.html" id="logo">
            <img src="img/logo.webp" alt="Logo" />
           <span>Edu<span id="logo-span">Mate</span></span>
          </a>
        </section>
        <button id="menu-btn" aria-label="Mở menu" aria-expanded="false">
          ☰
        </button>

        <ul id="nav" class="center">
          <li id="nav-gioi-thieu">
            <a href="index.html" id="link-gioi-thieu">Giới thiệu</a>
          </li>
          <li id="nav-bai-tap">
            <a href="subjects.html" id="link-bai-tap">Bài tập</a>
          </li>
          <li id="nav-cuoc-thi">
            <a href="contest.html" id="link-cuoc-thi">Cuộc thi</a>
          </li>
          <li id="nav-xep-hang">
            <a href="ranking.html" id="link-xep-hang" class="active">Xếp hạng</a>
          </li>
        </ul>

        <div class="user-account-area">
          <div id="auth-buttons">
            <a href="login.html" class="auth-link">Đăng nhập</a>
            <a href="register.html" class="auth-link">Đăng ký</a>
          </div>
          <!-- 2. Khi đã đăng nhập (mặc định thêm class hidden) -->
          <div id="user-profile" class="hidden">
            <div class="streak-box">🔥 <span>0</span></div>
            <span class="username">Username</span>
           <img src="img/avartar.webp" alt="Avatar" class="user-avatar" />
          </div>
      </div>
    </header>
    
    <div class="leaderboard-container">
        <!-- Phần Bục Tuyên Dương (Podium) -->
        <div class="podium-section">
            <!-- Top 3 (Đồng) -->
            <div class="podium-card silver">
                <img class="avatar" src="img/avartar.webp" alt="Avatar Top 2">
                <div class="step">2</div>
            </div>

            <!-- Top 1 (Vàng - Cao nhất) -->
            <div class="podium-card gold">
                <img class="avatar" src="img/avartar.webp" alt="Avatar Top 1">
                <div class="step">1</div>
            </div>

            <!-- Top 2 (Bạc) -->
            <div class="podium-card bronze">
                <img class="avatar" src="img/avartar.webp" alt="Avatar Top 3">
                <div class="step">3</div>
            </div>
        </div>

        <!-- Phần Bảng Người Dùng (Màu xanh) -->
        <div class="table-section">
            <table class="user-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Bio</th>
                    <th>Username</th>
                    <th>Điểm</th>
                  </tr>
                </thead>
                <tbody id="ranking-list">
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script src="ranking.js"></script>
  </body>
</html>
